<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Supply-weighted price ladders</title>
  <desc id="desc">Two abstract price ladders show a sparse cheap ask and a strongly supplied higher ask.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#15223e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
  </defs>
  <rect width="800" height="800" rx="44" fill="url(#bg)"/>
  <g stroke="#e5e7eb" stroke-opacity=".16" stroke-width="2">
    <path d="M120 120V650H690"/><path d="M120 530H690"/><path d="M120 410H690"/><path d="M120 290H690"/><path d="M120 170H690"/>
  </g>
  <g fill="#7dd3fc" fill-opacity=".65">
    <rect x="180" y="620" width="58" height="30" rx="8"/><rect x="280" y="572" width="58" height="78" rx="8"/>
    <rect x="380" y="470" width="58" height="180" rx="8"/><rect x="480" y="250" width="58" height="400" rx="8"/>
  </g>
  <g fill="#a7f3d0" fill-opacity=".86">
    <rect x="180" y="610" width="18" height="40" rx="8"/><rect x="280" y="500" width="18" height="150" rx="8"/>
    <rect x="380" y="360" width="18" height="290" rx="8"/><rect x="480" y="170" width="18" height="480" rx="8"/>
  </g>
  <path d="M209 610 C298 565 333 515 389 370 S470 205 509 170" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M209 610 C300 595 360 575 410 560 S500 510 580 510" fill="none" stroke="#fbbf24" stroke-opacity=".8" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14"/>
  <circle cx="209" cy="610" r="12" fill="#fbbf24"/><circle cx="509" cy="170" r="12" fill="#a7f3d0"/><circle cx="580" cy="510" r="10" fill="#fbbf24"/>
  <g fill="#e5e7eb" fill-opacity=".75"><rect x="180" y="690" width="150" height="12" rx="6"/><rect x="410" y="690" width="220" height="12" rx="6" fill="#7dd3fc"/></g>
</svg>
