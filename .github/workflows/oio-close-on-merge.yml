name: OIO close on merge

# Installed by OIO's installer; rerun it from a newer agent-stack-train checkout
# to move the pin instead of editing this file. Closes the issue logs a merged pull request
# names with Closes, Fixes or Resolves.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    uses: Pukujan/agent-stack-train/.github/workflows/close-on-merge.yml@edfe418a5463332d4509771a068e9bc991b045d7
    with:
      oio_ref: edfe418a5463332d4509771a068e9bc991b045d7
    secrets:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
