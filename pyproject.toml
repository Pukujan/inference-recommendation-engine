[project]
name = "inference-recommendation-engine-ops"
version = "0.1.0"
description = "Local operational tooling for the inference recommendation engine"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.0.0",
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["operational/scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
